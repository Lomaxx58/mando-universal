name: Compilar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          set -o pipefail
          gradle assembleDebug testDebugUnitTest 2>&1 | tee build.log

      - name: Mostrar errores
        if: failure()
        run: |
          grep -E "^e: |error:|FAILED|AssertionError|Exception|What went wrong" -A2 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Renombrar APK
        run: cp app/build/outputs/apk/debug/app-debug.apk MandoUniversal.apk

      - name: Publicar en Releases (enlace fijo para descargar desde el móvil)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ultima
          name: Última versión
          body: Abre este enlace desde el móvil Android y descarga MandoUniversal.apk.
          files: MandoUniversal.apk
          make_latest: true
